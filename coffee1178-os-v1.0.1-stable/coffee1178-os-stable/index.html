<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F1E8D8">
<title>Coffee 1178 & House — Seu pedido</title>
<style>
:root{--vanilla:#F1E8D8;--paper:#FBF8F2;--coffee:#76523D;--dark:#35261F;--muted:#8C796D;--line:#E8DED2;--surface:#fff;--soft:#EEE1D3}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--dark);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .28s,color .28s}
button{font:inherit;cursor:pointer}.hero{min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:42px 20px;background:var(--vanilla);transition:background .28s,color .28s}
.brand{color:var(--coffee);display:flex;flex-direction:column;align-items:center}.coffee,.house{font:400 13px Georgia,serif;letter-spacing:9px}.number{font:400 clamp(90px,24vw,138px)/.92 Georgia,serif;letter-spacing:-8px;margin:12px 0}.tag{font:400 11px Georgia,serif;letter-spacing:0;color:var(--coffee);margin-top:34px;text-transform:uppercase}
.wrap{max-width:960px;margin:auto;padding:26px 18px 110px}.intro{display:flex;justify-content:space-between;align-items:center;gap:12px}.intro h1{font:400 29px Georgia,serif;margin:4px 0}.eyebrow{font-size:11px;letter-spacing:0;color:var(--muted);text-transform:uppercase}.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 15px;color:var(--coffee)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0 28px}.tab{border:1px solid var(--line);background:#F7F0E7;border-radius:18px;padding:16px 10px;color:var(--coffee);font-weight:700;transition:.2s}.tab.active{background:var(--coffee);color:#fff;box-shadow:0 7px 16px #76523d30}
h2{font:400 28px/1.15 Georgia,serif;margin:24px 0 18px;letter-spacing:0}.products{display:grid;grid-template-columns:1fr;gap:12px}.product{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px 16px;box-shadow:0 5px 18px #4d30280b;display:flex;flex-direction:column;gap:14px;min-width:0}.product-media{width:100%;aspect-ratio:4/3;border-radius:13px;overflow:hidden;background:var(--soft);box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}.product-media img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;filter:none!important;transform:none!important;image-rendering:auto}.product-media.drink-full{background:#2a1c17;padding:7px}.product-media.drink-full img{object-fit:contain;object-position:center center}.product h3{font:600 19px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;letter-spacing:0!important;word-spacing:0!important;text-transform:none;overflow-wrap:anywhere}.product p{font-size:12px;line-height:1.35;color:var(--muted);margin:-4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.price{font-size:13px;font-weight:650;color:var(--coffee);letter-spacing:0}.add{border:0;border-radius:12px;background:var(--soft);color:var(--coffee);padding:10px 14px;font-size:13px;font-weight:750;white-space:nowrap;min-height:42px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fbf8f2ed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 18px}.bar-inner{max-width:960px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.note{font-size:11px;color:var(--muted);max-width:220px}.cartbtn{border:0;border-radius:17px;background:var(--coffee);color:#fff;padding:15px 20px}
body.house{--paper:#241914;--coffee:#D7A864;--dark:#F7EFE6;--muted:#C2AE9B;--line:#5C4133;--surface:#32241E;--soft:#4A342A;background:#241914}
body.house .hero{position:relative;background-color:#241914;background-image:url("./assets/preview-house-amber.jpg");background-position:center 48%;background-size:cover;background-repeat:no-repeat;color:#F4E1C4;margin-bottom:-1px;border-bottom:0;box-shadow:inset 0 -3px 0 #241914}
body.house .hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:5px;background:linear-gradient(to bottom,rgba(36,25,20,0),#241914);pointer-events:none}\nbody.house .brand{color:#F6E4C7;text-shadow:0 2px 18px rgba(30,14,8,.4)}body.house .tag{color:#F6E4C7;text-shadow:0 2px 18px rgba(30,14,8,.4);font-family:"Baskerville","Palatino Linotype",Georgia,serif!important;font-size:12px;font-weight:400;letter-spacing:4px!important;line-height:1.5;text-transform:uppercase}
body.house .coffee,body.house .house{font-family:"Baskerville","Palatino Linotype",Georgia,serif}body.house .tag{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}
body.house .coffee{letter-spacing:10px}body.house .house{letter-spacing:8px}body.house .number{color:#F4DFC0;font-family:"Baskerville","Palatino Linotype",Georgia,serif}
body.house .tab{background:#2E211B;border-color:#5E4234;color:#D7A864}body.house .tab.active{background:linear-gradient(145deg,#80502F,#B37435 58%,#80502F);color:#fff}
body.house .pill{background:#2C201B;color:#D8AF72}body.house .product{background:linear-gradient(180deg,rgba(58,42,34,.98),rgba(48,34,28,.98));border-color:#634739;box-shadow:0 8px 22px rgba(0,0,0,.14)}body.house .product h3{color:#FFF7EF}body.house .price{color:#DDB57C}body.house .add{background:#563A2D;color:#FFF6EC;border:1px solid #76523D}body.house .bar{background:rgba(31,22,18,.93)}body.house .cartbtn{background:linear-gradient(145deg,#7C4A27,#A8672E)}
.photo-note{font-size:11px;color:var(--muted);margin-top:-6px}.overlay{position:fixed;inset:0;background:rgba(25,16,12,.66);display:none;align-items:flex-end;z-index:50}.overlay.open{display:flex}.sheet{width:min(100%,650px);max-height:82vh;overflow:auto;margin:0 auto;background:var(--paper);color:var(--dark);border-radius:24px 24px 0 0;padding:22px 18px 28px;border:1px solid var(--line);box-shadow:0 -18px 50px rgba(0,0,0,.22)}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet-head h2{margin:0}.close{border:1px solid var(--line);background:var(--surface);color:var(--dark);border-radius:999px;width:38px;height:38px;font-size:22px;line-height:1}.cartrow{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:14px 0;border-bottom:1px solid var(--line)}.cartrow strong{font-size:14px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--dark)}.cart-total{display:flex;justify-content:space-between;gap:12px;padding-top:18px;font-weight:800}.empty-cart{padding:24px 0;color:var(--muted)}
@media(min-width:560px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:900px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{min-height:390px}}
@media(max-width:559px){.wrap{padding-left:14px;padding-right:14px}.intro{align-items:flex-start}.intro h1{font-size:25px}.tabs{gap:7px}.tab{padding:14px 8px;font-size:14px}.product{padding:16px}.product h3{font-size:18px}.bottom{align-items:center}.price{font-size:12px}.add{padding:9px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="./assets/menu/photos-original.js"></script>
<script src="./assets/menu/photo-patch.js"></script>

<body>
<header class="hero">
  <div class="brand"><span class="coffee">COFFEE</span><span class="number">1178</span><span class="house">&amp; HOUSE</span></div>
  <div class="tag">UMA NOVA FORMA DE VIVER O CAFÉ</div>
</header>
<main class="wrap">
  <div class="intro"><div><div class="eyebrow">Cardápio digital</div><h1>Escolha seu momento.</h1></div><span class="pill" id="tableLabel">Leia o QR da mesa</span></div>
  <nav class="tabs"><button class="tab active" id="cafeTab">Cafeteria 1178</button><button class="tab" id="houseTab">Coffee &amp; House</button></nav>
  <div class="eyebrow" id="hint">Cafés · confeitaria · salgados</div><h2 id="title">Cafeteria 1178</h2><p id="customerMessage" role="status" aria-live="polite"></p><button class="pill" id="newVisit" hidden>Iniciar nova visita</button><section id="orderStatus" aria-label="Seus pedidos" aria-live="polite"></section><div class="products" id="products"></div>
</main>
<div class="bar"><div class="bar-inner"><span class="note"><span id="connectionNote">Escaneie o QR da sua mesa para pedir.</span></span><button class="cartbtn" id="cartBtn">Ver carrinho · <span id="count">0</span></button></div></div>
<div class="overlay" id="overlay" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-label="Seu pedido"><div class="sheet-head"><h2>Seu pedido</h2><button class="close" id="closeCart" aria-label="Fechar">×</button></div><div id="cartItems"></div><div class="cart-total"><span>Total</span><span id="cartTotal">R$ 0,00</span></div><p id="sendMessage" role="status" aria-live="polite"></p><button class="cartbtn" id="sendOrder" disabled>Enviar pedido</button></section></div>
<script type="module" src="./assets/customer-app.mjs?v=products-20261106-03"></script>
<script type="module" src="./assets/staging-presentation.mjs?v=visual-20261106-02"></script>
</body></html>

.brand .house{letter-spacing:8px!important}
