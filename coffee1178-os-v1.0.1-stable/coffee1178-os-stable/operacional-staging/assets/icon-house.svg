  <text x="256" y="312" text-anchor="middle" fill="#fff8f0" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="500" letter-spacing="3">1178</text>
  <line x1="151" y1="340" x2="361" y2="340" stroke="#efc49f" stroke-opacity=".72" stroke-width="2"/>
  <text x="256" y="401" text-anchor="middle" fill="#fff4e8" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="400" letter-spacing="11">HOUSE</text>
