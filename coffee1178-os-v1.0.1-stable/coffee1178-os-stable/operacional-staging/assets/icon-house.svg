<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Coffee 1178 House">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c3a35"/>
      <stop offset=".38" stop-color="#9d5848"/>
      <stop offset=".7" stop-color="#d07c5d"/>
      <stop offset="1" stop-color="#5d312f"/>
    </linearGradient>
    <radialGradient id="amber" cx=".22" cy=".12" r=".9">
      <stop offset="0" stop-color="#f2b679" stop-opacity=".55"/>
      <stop offset=".52" stop-color="#d98362" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4f2828" stop-opacity=".28"/>
    </radialGradient>
    <pattern id="ribs" width="20" height="20" patternUnits="userSpaceOnUse">
