[build]
  command = ""
  publish = "."

[[redirects]]
  from = "/operacional-staging"
  to = "/operacional-staging/"
  status = 301

[[redirects]]
  from = "/operacional-staging/*"
  to = "/operacional-staging/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "script-src 'self' https://cdn.jsdelivr.net; script-src-attr 'none'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# Always revalidate the HTML and presentation entrypoints on mobile.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/pedido"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/assets/customer.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
[[headers]]
  for = "/assets/staging-presentation.mjs"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Isolated operational staging shell and scoped service worker.
[[headers]]
  for = "/operacional-staging/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/operacional-staging/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/operacional-staging/"
